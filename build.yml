name: Build APK

on:
  push:
  workflow_dispatch:      # кнопка «Run workflow» вручную

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Системные пакеты
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Кэш сборки (ускоряет повторные запуски)
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Buildozer
        run: |
          pip install --upgrade buildozer "cython==0.29.36"
          buildozer -v android debug

      - name: Сохранить APK
        uses: actions/upload-artifact@v4
        with:
          name: myplayer-apk
          path: bin/*.apk
